<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#6d28d9"/><text x="50" y="63" font-size="42" fill="white" text-anchor="middle" font-family="sans-serif" font-weight="700">A</text></svg></template>

<helmet>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/aio-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #F7F6FC; }
  a { color: #6366F1; }
  a:hover { color: #A855F7; }
  input:focus { outline: 2px solid #6366F1; outline-offset: 1px; }
</style>
</helmet>

<div style="font-family: 'Inter', Helvetica, Arial, sans-serif; background: #F7F6FC; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #12121A;">
  <div style="max-width: 420px; width: 100%; margin: 0 auto; padding: 24px;">
    <div style="padding: 40px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4E1F0;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 28px;">
        <img src="../assets/aio-media-icon.png" alt="AIO Media" style="width: 40px; height: 40px; object-fit: contain;">
        <span style="font-family: 'Sora', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.02em;">AIO MEDIA</span>
      </div>
      <h1 style="font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 700; text-align: center; margin: 0 0 8px;">Forgot password?</h1>
      <a href="./sign-in.html" style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; margin-bottom: 28px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
        back to login
      </a>

      <div style="display: flex; flex-direction: column; gap: 20px;">
        <div>
          <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px;">Email address<span style="color: #6366F1;">*</span></label>
          <input type="email" style="width: 100%; box-sizing: border-box; padding: 13px 14px; border-radius: 10px; background: #FFFFFF; border: 1px solid #DCD8EC; color: inherit; font-size: 15px; font-family: inherit;">
        </div>
        <button style="padding: 14px; border-radius: 10px; background: #6366F1; color: white; font-weight: 600; font-size: 15px; border: none; cursor: pointer;">Send email</button>
      </div>
    </div>
  </div>
</div>

</x-dc>
</body>
</html>
