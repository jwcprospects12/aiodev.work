  <div style="{{ desktopItemsStyle }}">
    <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="4">
      <div style="position: relative; flex-shrink: 0;" onMouseEnter="{{ item.onEnter }}" onMouseLeave="{{ item.onLeave }}">

          {{ item.label }}

            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="{{ item.chevronStyle }}"><polyline points="6 9 12 15 18 9"></polyline></svg>

        <div style="{{ item.panelStyle }}">

              <a href="{{ g.url }}" style="{{ g.linkStyle }}">
                <span>{{ g.title }}</span>
                <sc-if value="{{ g.hasChildren }}" hint-placeholder-val="{{ false }}">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 6 15 12 9 18"></polyline></svg>
                </sc-if>
              </a>

                <div style="{{ g.childPanelStyle }}">
                  <sc-for list="{{ g.children }}" as="c" hint-placeholder-count="3">
                    <a href="{{ c.url }}" style="{{ childLinkStyle }}">{{ c.title }}</a>
                  </sc-for>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>
        </sc-if>
      </div>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1200, &quot;height&quot;: 80}, &quot;active&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;home&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;home&quot;, &quot;firestick&quot;, &quot;install&quot;, &quot;vpn&quot;, &quot;rewards&quot;, &quot;troubleshooting&quot;]}}">
class Component extends DCLogic {
  state = { hovered: null, subHovered: null, isMobile: false, isNarrow: false, mobileOpen: false, searchOpen: false, query: '', sel: 0, focused: false };

  componentDidMount() {
    this.checkMobile();
    this.onResize = () => this.checkMobile();
    window.addEventListener('resize', this.onResize);
    this.onKey = (e) => {
      if (e.key === 'Escape' && this.state.searchOpen) { this.setState({ searchOpen: false }); }
    };
    window.addEventListener('keydown', this.onKey);
    this.onExternalOpen = (e) => {
      this.openSearch();
      const q = (e && e.detail && e.detail.query) || '';
      if (q) setTimeout(() => this.setState({ query: q, sel: 0 }), 30);
    };
    window.addEventListener('aio-open-search', this.onExternalOpen);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('keydown', this.onKey);
    window.removeEventListener('aio-open-search', this.onExternalOpen);
  }
  openSearch() {
    this.setState({ searchOpen: true, query: '', sel: 0 });
    setTimeout(() => { if (this.input) this.input.focus(); }, 20);
  }
  flatten(items) {
    const out = [];
    items.forEach(it => {
      out.push({ title: it.label, url: it.url, section: it.label });
      (it.guides || []).forEach(g => {
        if (g.children) g.children.forEach(c => out.push({ title: c.title, url: c.url, section: it.label }));
        else out.push({ title: g.title, url: g.url, section: it.label });
      });
    });
    const KW = {
      'Buffering Issues': 'buffering lag freeze freezing spinning stutter slow loading pause',
      'Account Expired': 'expired subscription renew payment login locked out',
      'VLC Playback Error': 'vlc playback error player wont play black screen',
      'TV Guide EPG not Downloaded': 'epg tv guide listings missing channels schedule',
      'Force Stop & Clear Cache': 'cache clear reset force stop crash crashing restart',
      'Installing Downloader': 'downloader sideload apk install app',
      'Enabling Developer Options': 'developer options unknown sources adb debugging',
      'Setting Up Your Firestick': 'firestick fire stick amazon setup wifi',
      'Before You Begin: What You Need': 'requirements before you begin what you need start',
      'Installing VPN': 'vpn install privacy secure connection',
      'Install AIO TV': 'aio tv install app firestick',
      'Install AIO TV Pro': 'aio tv pro install app premium',
      'Install AIO Stremio': 'stremio install addon',
      'Install TV Android': 'android phone tablet install mobile',
      'Install TV iOS': 'ios iphone ipad apple install mobile',
      'Install Stremio Android': 'stremio android mobile install',
      'Install Stremio iOS': 'stremio ios iphone ipad install',
      'Packages': 'packages pricing plans subscription buy',
      'Rewards': 'rewards points referral loyalty',
      'VPN': 'vpn privacy secure',
      'Setup': 'setup start begin firestick',
      'Installation': 'install installation apps',
      'Troubleshoot & FAQs': 'troubleshoot help faq problem issue fix',
    };
    const seen = {};
    return out.filter(r => { const k = r.title + r.url; if (seen[k]) return false; seen[k] = 1; return true; })
              .map(r => ({ ...r, kw: KW[r.title] || '' }));
  }
  checkMobile() {
    const isMobile = window.innerWidth < 1080;
    const isNarrow = window.innerWidth < 1280;
    if (isMobile !== this.state.isMobile || isNarrow !== this.state.isNarrow) this.setState({ isMobile, isNarrow, mobileOpen: isMobile ? this.state.mobileOpen : false });
  }

  renderVals() {
    const active = this.props.active ?? 'home';
    const hovered = this.state.hovered;
    const subHovered = this.state.subHovered;
    const isMobile = this.state.isMobile;
    const isNarrow = this.state.isNarrow;
    const mobileOpen = this.state.mobileOpen;

    const linkBase = {
      display: 'flex', alignItems: 'center', gap: '5px', fontSize: '13.5px', fontWeight: 500, textDecoration: 'none',
      whiteSpace: 'nowrap', padding: '8px 10px', borderBottom: '2px solid transparent', color: '#12121A'
    };
    const linkActive = { ...linkBase, color: '#6366F1', borderBottom: '2px solid #6366F1' };
    const panelBase = {
      position: 'absolute', top: '100%', left: '50%', minWidth: '230px', overflow: 'visible',
      padding: '8px', borderRadius: '12px', background: '#FFFFFF', border: '1px solid #E4E1F0',
      boxShadow: '0 16px 36px rgba(24,20,50,0.12)', transition: 'opacity 0.15s, transform 0.15s'
    };
    const guideLinkBase = {
      display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '10px', padding: '9px 12px',
      borderRadius: '8px', fontSize: '13px', fontWeight: 500, textDecoration: 'none', color: '#12121A'
    };
    const childPanelBase = {
      position: 'absolute', top: '-8px', left: '100%', marginLeft: '4px', minWidth: '210px',
      padding: '8px', borderRadius: '12px', background: '#EFEDF8', border: '1px solid #DCD8EC',
      boxShadow: '0 16px 36px rgba(24,20,50,0.12)', transition: 'opacity 0.15s, transform 0.15s'
    };

    const items = [
      { key: 'firestick', label: 'Setup', url: './firestick-setup.html', guides: [
        { title: 'Before You Begin: What You Need', url: './before-you-begin.html' },
        { title: 'Setting Up Your Firestick', url: './setting-up-your-firestick.html' },
        { title: 'Installing Downloader', url: './installing-downloader.html' },
        { title: 'Enabling Developer Options', url: './enabling-developer-options.html' },
      ] },
      { key: 'install', label: 'Installation', url: '../installation/app-installation-guides.html', guides: [
        { title: 'TV Apps', url: '../installation/app-installation-guides.html', children: [
          { title: 'Install AIO TV', url: '../installation/install-aio-tv.html' },
          { title: 'Install AIO TV Pro', url: '../installation/install-aio-tv-pro.html' },
          { title: 'Install AIO Stremio', url: '../installation/install-aio-stremio.html' },
        ] },
        { title: 'Mobile Apps', url: '../installation/app-installation-guides.html', children: [
          { title: 'Install TV Android', url: '../installation/install-android-app.html' },
          { title: 'Install TV iOS', url: '../installation/install-apple-app.html' },
          { title: 'Install Stremio Android', url: '../installation/install-stremio-android.html' },
          { title: 'Install Stremio iOS', url: '../installation/install-stremio-ios.html' },
        ] },
        { title: 'Installing VPN', url: '../installation/installing-vpn.html' },
      ] },
      { key: 'vpn', label: 'VPN', url: '../vpn/vpn-guides.html', guides: [] },
      { key: 'rewards', label: 'Rewards', url: '../rewards/rewards.html', guides: [
        { title: 'Packages', url: '../rewards/packages.html' },
      ] },
      { key: 'troubleshooting', label: 'Troubleshoot & FAQs', url: '../troubleshoot/troubleshooting-and-fixes.html', guides: [
        { title: 'Account Expired', url: '../troubleshoot/account-expired.html' },
        { title: 'VLC Playback Error', url: '../troubleshoot/vlc-playback-error.html' },
        { title: 'TV Guide (EPG) not Downloaded', url: '../troubleshoot/tv-guide-epg-not-downloaded.html' },
        { title: 'Force Stop & Clear Cache', url: '../troubleshoot/force-stop-clear-cache.html' },
        { title: 'Buffering Issues', url: '../troubleshoot/buffering-issues.html' },
      ] },
    ];

    const navStyle = {
      display: 'grid', gridTemplateColumns: 'auto minmax(0, 1fr) auto', alignItems: 'center', gap: '16px',
      padding: isMobile ? '10px 16px' : '12px 32px', borderBottom: '1px solid #E4E1F0', position: 'sticky', top: 0,
      background: 'rgba(247,246,252,0.92)', backdropFilter: 'blur(8px)', zIndex: 20, fontFamily: "'Inter', Helvetica, Arial, sans-serif",
    };
    const logoTextStyle = { display: isNarrow ? 'none' : 'inline', fontFamily: "'Sora', sans-serif", fontWeight: 700, fontSize: '17px', letterSpacing: '-0.01em', whiteSpace: 'nowrap' };
    const desktopItemsStyle = { display: isMobile ? 'none' : 'flex', alignItems: 'center', justifyContent: 'center', gap: '4px', minWidth: 0, overflow: 'visible' };
    const searchKbdStyle = { display: 'flex', alignItems: 'center', justifyContent: 'flex-start', gap: '6px', padding: isMobile ? '6px 10px' : '8px 16px', borderRadius: '8px', background: '#EFEDF8', border: '1px solid #E4E1F0', fontSize: isMobile ? '12.5px' : '13.5px', fontWeight: 500, color: '#4A4A5A', flexShrink: 1, width: isMobile ? '108px' : '340px', maxWidth: '100%', outline: 'none', fontFamily: "'Inter', Helvetica, Arial, sans-serif", boxSizing: 'border-box' };

    const hamburgerStyle = {
      display: isMobile ? 'flex' : 'none', alignItems: 'center', justifyContent: 'center', width: '36px', height: '36px',
      borderRadius: '8px', background: 'transparent', border: '1px solid #E4E1F0', color: '#12121A', cursor: 'pointer', flexShrink: 0,
    };
    const mobilePanelStyle = {
      display: (isMobile && mobileOpen) ? 'flex' : 'none', flexDirection: 'column', gap: '2px',
      position: 'absolute', top: '100%', left: 0, right: 0, padding: '10px 20px 16px',
      background: '#FFFFFF', borderBottom: '1px solid #E4E1F0', boxShadow: '0 16px 36px rgba(24,20,50,0.12)', zIndex: 30,
    };
    const mobileLinkBase = { display: 'block', padding: '12px 4px', fontSize: '15px', fontWeight: 500, textDecoration: 'none', color: '#12121A', borderBottom: '1px solid #E4E1F0' };
    const mobileLinkActive = { ...mobileLinkBase, color: '#6366F1' };
    const closeMobile = () => this.setState({ mobileOpen: false });
    const mobileNavItems = items.map(it => ({
      key: it.key, label: it.label, url: it.url,
      linkStyle: it.key === active ? mobileLinkActive : mobileLinkBase,
    }));

    const index = this.flatten(items);
    const q = this.state.query.trim().toLowerCase();
    const matches = q ? index.filter(r => (r.title + ' ' + r.section + ' ' + r.kw).toLowerCase().includes(q)).slice(0, 7) : [];
    const sel = Math.min(this.state.sel, Math.max(matches.length - 1, 0));
    const resultBase = {
      display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '12px', padding: '10px 12px',
      borderRadius: '8px', fontSize: '13.5px', fontWeight: 500, textDecoration: 'none', color: '#12121A',
    };
    const searchWrapStyle = { display: isMobile ? 'none' : 'block', position: 'relative', flexShrink: 1, minWidth: 0 };
    const dropdownStyle = {
      display: (this.state.focused && q) ? 'flex' : 'none', flexDirection: 'column', gap: '2px',
      position: 'absolute', top: 'calc(100% + 6px)', right: 0, width: '100%', minWidth: isMobile ? '240px' : '340px',
      padding: '6px', borderRadius: '10px', background: '#FFFFFF', border: '1px solid #E4E1F0',
      boxShadow: '0 18px 40px rgba(24,20,50,0.16)', zIndex: 40, maxHeight: '340px', overflowY: 'auto',
    };
    const searchOverlayStyle = {
      display: this.state.searchOpen ? 'flex' : 'none', position: 'fixed', inset: 0, zIndex: 60,
      alignItems: 'flex-start', justifyContent: 'center', padding: '12vh 20px 20px',
      background: 'rgba(24,20,50,0.28)', backdropFilter: 'blur(3px)',
    };
    const searchPanelStyle = {
      width: '100%', maxWidth: '560px', borderRadius: '14px', background: '#FFFFFF',
      border: '1px solid #E4E1F0', boxShadow: '0 24px 60px rgba(24,20,50,0.22)', overflow: 'hidden',
    };

    return {
      sectionLabelStyle: { display: isMobile ? 'none' : 'block', flexShrink: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', fontSize: '11.5px', color: '#6E6A80' },
      searchWrapStyle,
      dropdownStyle,
      onFocus: () => this.setState({ focused: true }),
      onBlur: () => setTimeout(() => this.setState({ focused: false }), 160),
      searchOverlayStyle,
      searchPanelStyle,
      query: this.state.query,
      noResults: matches.length === 0,
      inputRef: (el) => { this.input = el; },
      stopProp: (e) => e.stopPropagation(),
      openSearch: () => this.openSearch(),
      closeSearch: () => this.setState({ searchOpen: false }),
      onQuery: (e) => this.setState({ query: e.target.value, sel: 0 }),
      onKeyDown: (e) => {
        if (e.key === 'Enter') {
          const s = (this.state.query || '').trim();
          if (s) window.location.href = '../search-results/?q=' + encodeURIComponent(s);
        }
      },
      results: matches.map((r, i) => ({
        ...r,
        style: i === sel ? { ...resultBase, background: '#EFEDF8' } : resultBase,
        onEnter: () => this.setState({ sel: i }),
      })),
      navStyle,
      logoTextStyle,
      desktopItemsStyle,
      searchKbdStyle,
      hamburgerStyle,
      mobilePanelStyle,
      mobileNavItems,
      toggleMobile: () => this.setState({ mobileOpen: !this.state.mobileOpen }),
      closeMobile,
      childLinkStyle: guideLinkBase,
      navItems: items.map(it => ({
        ...it,
        hasGuides: it.guides.length > 0,
        linkStyle: it.key === active ? linkActive : linkBase,
        chevronStyle: { transition: 'transform 0.15s', transform: hovered === it.key ? 'rotate(180deg)' : 'rotate(0deg)' },
        panelStyle: hovered === it.key
          ? { ...panelBase, opacity: 1, pointerEvents: 'auto', transform: 'translateX(-50%) translateY(4px)' }
          : { ...panelBase, opacity: 0, pointerEvents: 'none', transform: 'translateX(-50%) translateY(0px)' },
        onEnter: () => this.setState({ hovered: it.key }),
        onLeave: () => this.setState({ hovered: null, subHovered: null }),
        guides: it.guides.map(g => {
          const subKey = it.key + '|' + g.title;
          const hasChildren = !!g.children;
          return {
            ...g,
            hasChildren,
            linkStyle: guideLinkBase,
            onEnter: hasChildren ? (() => this.setState({ subHovered: subKey })) : undefined,
            onLeave: hasChildren ? (() => this.setState({ subHovered: null })) : undefined,
            childPanelStyle: subHovered === subKey
              ? { ...childPanelBase, opacity: 1, pointerEvents: 'auto' }
              : { ...childPanelBase, opacity: 0, pointerEvents: 'none' },
          };
        }),
      })),
    };
  }
}
</script>
</body>
